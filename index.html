<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Car Container Tycoon 3D Fix</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #090d16; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        #canvas-container { width: 100vw; height: 100vh; display: block; touch-action: none; }

        /* MAIN MENU */
        #main-menu {
            position: fixed; top:0; left:0; width:100vw; height:100vh; background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white;
        }
        #main-menu h1 { font-size: 32px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; color: #38bdf8; text-shadow: 0 0 15px rgba(56,189,248,0.6); text-align: center; }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 320px; }
        .menu-btn { padding: 12px; font-size: 15px; font-weight: bold; border-radius: 12px; border: none; cursor: pointer; background: #2563eb; color: white; box-shadow: 0 4px 15px rgba(37,99,235,0.4); }
        .menu-btn.full { grid-column: span 2; background: #10b981; font-size: 18px; padding: 14px; }
        .menu-btn.alt { background: #334155; }
        .menu-btn:active { transform: scale(0.96); }

        /* HUD */
        .hud { position: absolute; top: 15px; left: 15px; z-index: 100; color: #fff; display: flex; gap: 10px; align-items: center; }
        .hud-balance { font-size: 18px; font-weight: bold; background: rgba(15, 23, 42, 0.85); padding: 8px 14px; border-radius: 12px; border: 1px solid #334155; backdrop-filter: blur(8px); }
        .hud-right { position: absolute; top: 15px; right: 15px; z-index: 100; display: flex; gap: 6px; }
        .btn-top { padding: 8px 12px; background: rgba(30, 41, 59, 0.85); color: white; border: 1px solid #475569; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; backdrop-filter: blur(8px); }

        /* JOYSTICK */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; z-index: 150; touch-action: none; }
        #joystick-stick { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(56, 189, 248, 0.9); border-radius: 50%; box-shadow: 0 0 12px rgba(56,189,248,0.6); pointer-events: none; }

        /* MODALS */
        .modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85vw; height: 85vh; background: rgba(15, 23, 42, 0.96); border-radius: 20px; border: 1px solid #334155;
            z-index: 2000; padding: 20px; color: white; box-shadow: 0 20px 50px rgba(0,0,0,0.9); flex-direction: column; backdrop-filter: blur(14px);
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .modal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; overflow-y: auto; flex: 1; padding-right: 5px; }
        .card { background: #1e293b; border-radius: 12px; padding: 10px; text-align: center; border: 1px solid #334155; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .card.locked { background: #0f172a; opacity: 0.5; filter: grayscale(1); }
        .card-icon { width: 100%; height: 55px; background: #0f172a; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 30px; margin-bottom: 4px; }
        .btn-act { padding: 6px 10px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 11px; margin-top: 4px; }
        .btn-act.sell { background: #ef4444; }
        .btn-act.buy { background: #10b981; }
        .btn-close { background: #475569; padding: 6px 14px; border-radius: 8px; border: none; color: white; cursor: pointer; font-weight: bold; }

        #exit-car-btn { display: none; position: absolute; bottom: 30px; right: 30px; z-index: 150; padding: 14px 22px; background: #f59e0b; color: #000; font-weight: bold; border-radius: 12px; border: none; font-size: 15px; box-shadow: 0 4px 15px rgba(245,158,11,0.4); }

        .color-picker { display: flex; gap: 8px; margin-top: 10px; justify-content: center; }
        .color-dot { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- MAIN MENU -->
    <div id="main-menu">
        <h1>CAR CONTAINER TYCOON 3D</h1>
        <div class="menu-grid">
            <button class="menu-btn full" onclick="startGame()">▶ ГРАТИ</button>
            <button class="menu-btn alt" onclick="openModal('garage-modal')">🏎️ Гараж</button>
            <button class="menu-btn alt" onclick="openModal('shop-modal')">🏪 Автосалон</button>
            <button class="menu-btn alt" onclick="openModal('auction-modal')">🔨 Аукціон</button>
            <button class="menu-btn alt" onclick="openModal('tuning-modal')">🛠️ Тюнінг</button>
            <button class="menu-btn full alt" onclick="openModal('collection-modal')">🏆 Колекція</button>
        </div>
    </div>

    <!-- HUD -->
    <div class="hud">
        <div class="hud-balance">💰 <span id="balance-display">300,000</span> ₴</div>
    </div>
    <div class="hud-right">
        <button class="btn-top" onclick="openModal('garage-modal')">🏎️ Гараж</button>
        <button class="btn-top" onclick="openModal('shop-modal')">🏪 Салон</button>
        <button class="btn-top" onclick="openModal('auction-modal')">🔨 Аукціон</button>
        <button class="btn-top" onclick="openModal('tuning-modal')">🛠️ Тюнінг</button>
        <button class="btn-top" onclick="openModal('collection-modal')">🏆 Колекція</button>
        <button class="btn-top" style="background:#ef4444;" onclick="exitToMainMenu()">🚪 Меню</button>
    </div>

    <!-- JOYSTICK -->
    <div id="joystick-zone"><div id="joystick-stick"></div></div>
    <button id="exit-car-btn" onclick="exitCar()">Вийти з авто 🚪</button>

    <!-- MODALS -->
    <div id="garage-modal" class="modal">
        <div class="modal-header">
            <h2>🏎️ Мої Автомобілі</h2>
            <button class="btn-close" onclick="closeModal('garage-modal')">Закрити ✖</button>
        </div>
        <div class="modal-grid" id="garage-list"></div>
    </div>

    <div id="shop-modal" class="modal">
        <div class="modal-header">
            <h2>🏪 Автосалон</h2>
            <button class="btn-close" onclick="closeModal('shop-modal')">Закрити ✖</button>
        </div>
        <div class="modal-grid" id="shop-list"></div>
    </div>

    <div id="auction-modal" class="modal">
        <div class="modal-header">
            <h2>🔨 Аукціон Авто</h2>
            <button class="btn-close" onclick="closeModal('auction-modal')">Закрити ✖</button>
        </div>
        <div class="modal-grid" id="auction-list"></div>
    </div>

    <div id="tuning-modal" class="modal">
        <div class="modal-header">
            <h2>🛠️ Тюнінг-ательє</h2>
            <button class="btn-close" onclick="closeModal('tuning-modal')">Закрити ✖</button>
        </div>
        <div style="text-align:center; padding: 20px;">
            <h3>Колір авто:</h3>
            <div class="color-picker">
                <div class="color-dot" style="background:#ffffff;" onclick="changeCarColor(0xffffff)"></div>
                <div class="color-dot" style="background:#111111;" onclick="changeCarColor(0x111111)"></div>
                <div class="color-dot" style="background:#dc2626;" onclick="changeCarColor(0xdc2626)"></div>
                <div class="color-dot" style="background:#2563eb;" onclick="changeCarColor(0x2563eb)"></div>
                <div class="color-dot" style="background:#eab308;" onclick="changeCarColor(0xeab308)"></div>
            </div>
        </div>
    </div>

    <div id="collection-modal" class="modal">
        <div class="modal-header">
            <h2>🏆 Колекція (<span id="col-count">0</span>/30)</h2>
            <button class="btn-close" onclick="closeModal('collection-modal')">Закрити ✖</button>
        </div>
        <div class="modal-grid" id="collection-list"></div>
    </div>

    <div id="canvas-container"></div>

    <script>
        const ALL_CARS = [
            { id: 1, name: "Лада 2107", price: 25000, color: 0xffffff, icon: "🚗", speed: 0.25, rarity: "Звичайна" },
            { id: 2, name: "ЗАЗ Таврія", price: 15000, color: 0x888888, icon: "🚗", speed: 0.20, rarity: "Звичайна" },
            { id: 3, name: "VW Golf 4", price: 60000, color: 0x1e3a8a, icon: "🚗", speed: 0.30, rarity: "Звичайна" },
            { id: 4, name: "BMW M5 E39", price: 180000, color: 0x111111, icon: "🏎️", speed: 0.42, rarity: "Рідкісна" },
            { id: 5, name: "Audi RS7", price: 850000, color: 0x991b1b, icon: "🏎️", speed: 0.55, rarity: "Епічна" },
            { id: 6, name: "Mercedes W124", price: 110000, color: 0x334155, icon: "🚗", speed: 0.34, rarity: "Звичайна" },
            { id: 7, name: "Toyota Supra", price: 650000, color: 0xeab308, icon: "🏎️", speed: 0.50, rarity: "Рідкісна" },
            { id: 8, name: "Nissan GTR R35", price: 950000, color: 0x475569, icon: "🏎️", speed: 0.58, rarity: "Епічна" },
            { id: 9, name: "Porsche 911", price: 1400000, color: 0xd97706, icon: "⚡", speed: 0.62, rarity: "Легендарна" },
            { id: 10, name: "BMW M3 G80", price: 780000, color: 0x0284c7, icon: "🏎️", speed: 0.52, rarity: "Епічна" }
        ];

        let balance = 300000;
        let garage = [];
        let unlockedIds = new Set();
        let inCar = false;
        let currentDrivenCarMesh = null;
        let currentCarData = null;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38bdf8);
        scene.fog = new THREE.FogExp2(0x38bdf8, 0.007);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const ambient = new THREE.AmbientLight(0xffffff, 0.8); scene.add(ambient);
        const sun = new THREE.DirectionalLight(0xffffff, 0.9);
        sun.position.set(60, 100, 40); sun.castShadow = true; scene.add(sun);

        const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x15803d }));
        ground.rotation.x = -Math.PI / 2; scene.add(ground);

        const asphalt = new THREE.Mesh(new THREE.PlaneGeometry(160, 140), new THREE.MeshStandardMaterial({ color: 0x1e293b }));
        asphalt.rotation.x = -Math.PI / 2; asphalt.position.y = 0.02; scene.add(asphalt);

        // Персонаж
        const player = new THREE.Group();
        const pBody = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 1.4), new THREE.MeshStandardMaterial({ color: 0x2563eb }));
        pBody.position.y = 1.0; player.add(pBody);
        const pHead = new THREE.Mesh(new THREE.SphereGeometry(0.35), new THREE.MeshStandardMaterial({ color: 0xfde047 }));
        pHead.position.y = 2.0; player.add(pHead);
        player.position.set(0, 0, 20); scene.add(player);

        // Контейнери
        const containers = [];
        [-40, -20, 0, 20, 40].forEach((x, idx) => {
            const grp = new THREE.Group();
            const box = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 12), new THREE.MeshStandardMaterial({ color: 0xd97706 }));
            box.position.y = 2.5; grp.add(box);
            grp.position.set(x, 0, -35); scene.add(grp);
            containers.push({ mesh: grp, price: (idx + 1) * 75000, opened: false });
        });

        // ПРОСТИЙ ТА ТОЧНИЙ ДЖОЙСТИК
        let joyX = 0, joyY = 0;
        const jZone = document.getElementById('joystick-zone');
        const jStick = document.getElementById('joystick-stick');

        jZone.addEventListener('touchstart', e => updateJoy(e.touches[0]));
        jZone.addEventListener('touchmove', e => updateJoy(e.touches[0]));
        jZone.addEventListener('touchend', () => { joyX = 0; joyY = 0; jStick.style.left = '35px'; jStick.style.top = '35px'; });

        function updateJoy(touch) {
            const rect = jZone.getBoundingClientRect();
            const dx = touch.clientX - (rect.left + 60);
            const dy = touch.clientY - (rect.top + 60);
            const dist = Math.min(Math.hypot(dx, dy), 40);
            const angle = Math.atan2(dy, dx);
            joyX = (Math.cos(angle) * dist) / 40;
            joyY = (Math.sin(angle) * dist) / 40;
            jStick.style.left = `${35 + joyX * 30}px`; jStick.style.top = `${35 + joyY * 30}px`;
        }

        // Камера
        let cameraYaw = 0, cameraPitch = 0.35, lastX = 0, lastY = 0, isDrag = false;
        window.addEventListener('touchstart', e => {
            if (e.touches[0].clientX > window.innerWidth / 2) {
                isDrag = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchmove', e => {
            if (isDrag) {
                const t = e.touches[0];
                cameraYaw -= (t.clientX - lastX) * 0.005;
                cameraPitch = Math.max(0.1, Math.min(0.9, cameraPitch + (t.clientY - lastY) * 0.005));
                lastX = t.clientX; lastY = t.clientY;
            }
        });
        window.addEventListener('touchend', () => isDrag = false);

        function createCarMesh(col) {
            const grp = new THREE.Group();
            const b = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.1, 5.2), new THREE.MeshStandardMaterial({ color: col }));
            b.position.y = 0.7; grp.add(b);
            const r = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.8, 2.6), new THREE.MeshStandardMaterial({ color: 0x0f172a }));
            r.position.set(0, 1.5, -0.2); grp.add(r);
            return grp;
        }

        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (Math.abs(joyX) > 0.1 || Math.abs(joyY) > 0.1) {
                const targetObj = inCar ? currentDrivenCarMesh : player;
                const speed = inCar ? currentCarData.speed * 45 : 12;
                
                // Простий рух відносно напрямку камери
                const moveAngle = Math.atan2(-joyX, -joyY) + cameraYaw;
                targetObj.rotation.y = moveAngle;
                targetObj.translateZ(speed * delta);
            }

            const camTarget = inCar ? currentDrivenCarMesh.position : player.position;
            camera.position.x = camTarget.x + 10 * Math.sin(cameraYaw) * Math.cos(cameraPitch);
            camera.position.z = camTarget.z + 10 * Math.cos(cameraYaw) * Math.cos(cameraPitch);
            camera.position.y = camTarget.y + 10 * Math.sin(cameraPitch);
            camera.lookAt(camTarget.x, camTarget.y + 1, camTarget.z);

            containers.forEach(c => {
                if (!c.opened && !inCar && player.position.distanceTo(c.mesh.position) < 6) {
                    if (confirm(`Відкрити контейнер за ${c.price.toLocaleString()} ₴?`)) {
                        if (balance >= c.price) {
                            balance -= c.price; c.opened = true; c.mesh.position.y = -20;
                            document.getElementById('balance-display').innerText = balance.toLocaleString();
                            const won = ALL_CARS[Math.floor(Math.random() * ALL_CARS.length)];
                            garage.push({ ...won }); unlockedIds.add(won.id);
                            alert(`🎉 Ви виграли ${won.name}!`);
                        } else alert("Недостатньо грошей!");
                    }
                }
            });

            renderer.render(scene, camera);
        }
        animate();

        function startGame() { document.getElementById('main-menu').style.display = 'none'; }
        function exitToMainMenu() { document.getElementById('main-menu').style.display = 'flex'; }
        function openModal(id) {
            if (id === 'garage-modal') renderGarage();
            if (id === 'shop-modal') renderShop();
            if (id === 'auction-modal') renderAuction();
            if (id === 'collection-modal') renderCollection();
            document.getElementById(id).style.display = 'flex';
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function renderGarage() {
            const list = document.getElementById('garage-list'); list.innerHTML = '';
            if (garage.length === 0) list.innerHTML = '<p style="grid-column:1/-1;text-align:center;">Гараж порожній!</p>';
            else {
                garage.forEach((car, index) => {
                    const card = document.createElement('div'); card.className = 'card';
                    card.innerHTML = `
                        <div class="card-icon">${car.icon}</div>
                        <h4>${car.name}</h4>
                        <button class="btn-act" onclick="spawnCar(${index})">Поїхати 🔑</button>
                        <button class="btn-act sell" onclick="sellCar(${index})">Продати 💰</button>
                    `;
                    list.appendChild(card);
                });
            }
        }

        function renderShop() {
            const list = document.getElementById('shop-list'); list.innerHTML = '';
            ALL_CARS.forEach(car => {
                const card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `
                    <div class="card-icon">${car.icon}</div>
                    <h4>${car.name}</h4>
                    <p style="font-size:12px;">${car.price.toLocaleString()} ₴</p>
                    <button class="btn-act buy" onclick="buyCar(${car.id})">Купити 🛒</button>
                `;
                list.appendChild(card);
            });
        }

        function renderAuction() {
            const list = document.getElementById('auction-list'); list.innerHTML = '';
            [ALL_CARS[3], ALL_CARS[8]].forEach(car => {
                const card = document.createElement('div'); card.className = 'card';
                card.innerHTML = `
                    <div class="card-icon">${car.icon}</div>
                    <h4>${car.name}</h4>
                    <button class="btn-act buy" onclick="buyCar(${car.id})">Купити 🔨</button>
                `;
                list.appendChild(card);
            });
        }

        function renderCollection() {
            const list = document.getElementById('collection-list'); list.innerHTML = '';
            document.getElementById('col-count').innerText = unlockedIds.size;
            ALL_CARS.forEach(car => {
                const isUnlocked = unlockedIds.has(car.id);
                const card = document.createElement('div'); card.className = `card ${isUnlocked ? '' : 'locked'}`;
                card.innerHTML = `
                    <div class="card-icon">${isUnlocked ? car.icon : '🔒'}</div>
                    <h4>${isUnlocked ? car.name : '???'}</h4>
                `;
                list.appendChild(card);
            });
        }

        function buyCar(id) {
            const car = ALL_CARS.find(c => c.id === id);
            if (balance >= car.price) {
                balance -= car.price;
                document.getElementById('balance-display').innerText = balance.toLocaleString();
                garage.push({ ...car }); unlockedIds.add(car.id);
                alert(`Куплено ${car.name}!`); renderShop();
            } else alert("Мало грошей!");
        }

        function sellCar(index) {
            balance += garage[index].price * 0.8;
            document.getElementById('balance-display').innerText = balance.toLocaleString();
            garage.splice(index, 1); renderGarage();
        }

        function spawnCar(index) {
            closeModal('garage-modal');
            currentCarData = garage[index];
            if (currentDrivenCarMesh) scene.remove(currentDrivenCarMesh);
            currentDrivenCarMesh = createCarMesh(currentCarData.color);
            currentDrivenCarMesh.position.copy(player.position);
            scene.add(currentDrivenCarMesh);
            player.visible = false; inCar = true;
            document.getElementById('exit-car-btn').style.display = 'block';
        }

        function exitCar() {
            if (inCar && currentDrivenCarMesh) {
                player.position.copy(currentDrivenCarMesh.position);
                player.position.x += 3; player.visible = true;
                scene.remove(currentDrivenCarMesh); currentDrivenCarMesh = null;
                inCar = false; document.getElementById('exit-car-btn').style.display = 'none';
            }
        }

        function changeCarColor(hex) {
            if (inCar && currentDrivenCarMesh) {
                currentDrivenCarMesh.children[0].material.color.setHex(hex);
                closeModal('tuning-modal');
            } else alert("Сядьте в авто!");
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
